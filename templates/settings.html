<div class="flex flex-col h-full p-6 gap-4">
    <div class="flex items-center justify-between">
        <h2 class="page-title">Settings</h2>
        <button
            class="icon-btn"
            hx-tauri-invoke="render_main_content"
            hx-target="#main-content"
            hx-swap="innerHTML"
        >
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
            </svg>
        </button>
    </div>

    <div class="flex flex-col gap-4">
        <!-- User Settings Section -->
        <div class="card">
            <h3 class="card-title">User Information</h3>
            <div class="card-section">
                <div>
                    <label class="form-label">Display Name</label>
                    <input
                        type="text"
                        value="{{ user_name }}"
                        class="form-input"
                        readonly
                    />
                </div>
                <div>
                    <label class="form-label">User ID</label>
                    <input
                        type="text"
                        value="{{ user_id }}"
                        class="form-input font-mono text-sm"
                        readonly
                    />
                </div>
                <div class="pt-2">
                    <button
                        type="button"
                        class="w-full btn-secondary py-2 px-4"
                        hx-tauri-invoke="reset_user"
                        hx-trigger="click"
                    >
                        Select Different User
                    </button>
                </div>
            </div>
        </div>

        <!-- Group Settings Section -->
        <div class="card">
            <h3 class="card-title">Group Configuration</h3>
            <div class="card-section">
                <div>
                    <label class="form-label">Group Repository URL</label>
                    <input
                        type="text"
                        value="{{ group_remote_url }}"
                        class="form-input font-mono text-sm"
                        readonly
                    />
                </div>
                <div>
                    <h4 class="section-subtitle">Group Members</h4>
                    <div class="card-section">
                        {% for member in group_members %}
                        <div class="flex items-center justify-between card-item">
                            <span class="text-zinc-200">{{ member }}</span>
                        </div>
                        {% endfor %}
                    </div>
                </div>
            </div>
        </div>

        <!-- Ledger Settings Section -->
        <div class="card">
            <h3 class="card-title">Ledgers</h3>
            <div class="card-section">
                {% for ledger in ledgers %}
                <div class="flex items-center justify-between card-item">
                    <span class="text-zinc-200">{{ ledger }}</span>
                    {% if *ledger == current_ledger %}
                    <span class="badge-status">CURRENT</span>
                    {% endif %}
                </div>
                {% endfor %}
            </div>
        </div>

        <!-- SSH Keys Section -->
        <div class="card">
            <h3 class="card-title">SSH Keys</h3>
            <div class="card-section">
                <div>
                    <label class="form-label">Private Key Location</label>
                    <div class="flex gap-2">
                        <input
                            id="ssh-private-key-path"
                            type="text"
                            value="{{ ssh_private_key_path }}"
                            class="flex-1 form-input font-mono text-sm"
                            readonly
                        />
                        <button
                            onclick="navigator.clipboard.writeText(document.getElementById('ssh-private-key-path').value); this.textContent='Copied!'; setTimeout(() => this.textContent='Copy', 2000)"
                            class="btn-primary"
                        >
                            Copy
                        </button>
                    </div>
                </div>
                <div>
                    <label class="form-label">Public Key</label>
                    <div class="flex gap-2">
                        <input
                            id="ssh-public-key"
                            type="text"
                            value="{{ ssh_public_key }}"
                            class="flex-1 form-input font-mono text-xs"
                            readonly
                        />
                        <button
                            onclick="navigator.clipboard.writeText(document.getElementById('ssh-public-key').value); this.textContent='Copied!'; setTimeout(() => this.textContent='Copy', 2000)"
                            class="btn-primary"
                        >
                            Copy
                        </button>
                    </div>
                </div>
            </div>
        </div>

    </div>
</div>
