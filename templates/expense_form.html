<div class="flex flex-col h-full p-6 gap-4">
  <div class="flex items-center justify-between">
    <h2 class="text-2xl font-bold text-orange-500">{{ form_title }}</h2>
    <button
      class="text-zinc-400 hover:text-orange-500 transition-colors"
      hx-tauri-invoke="render_transactions"
      hx-target="#expense-list">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
      </svg>
    </button>
  </div>

  <!-- Form -->
  <form class="flex flex-col gap-4">
    <!-- Expense Info Card -->
    <div class="bg-zinc-900 rounded-lg p-4 border border-zinc-700">
      <h3 class="text-lg font-semibold text-zinc-300 mb-3">Expense Info</h3>
      <div class="space-y-3">
        <!-- Description field -->
        <div class="form-group">
          <label class="block text-sm font-medium text-zinc-400 mb-2" for="description">
            Description
          </label>
          <input
            type="text"
            name="description"
            id="description"
            value="{{ description }}"
            required
            class="w-full bg-zinc-800 border border-zinc-700 rounded px-4 py-2 text-zinc-200 focus:border-orange-500 focus:outline-none transition-colors">
        </div>

        <!-- Amount and Currency -->
        <div class="grid grid-cols-2 gap-4">
          <div class="form-group">
            <label class="block text-sm font-medium text-zinc-400 mb-2" for="amount">
              Amount
            </label>
            <input
              type="number"
              name="amount"
              id="amount"
              value="{{ amount | fmt("{:.2}") }}"
              step="0.01"
              min="0"
              required
              class="w-full bg-zinc-800 border border-zinc-700 rounded px-4 py-2 text-zinc-200 focus:border-orange-500 focus:outline-none transition-colors">
          </div>

          <div class="form-group">
            <label class="block text-sm font-medium text-zinc-400 mb-2" for="currency">
              Currency
            </label>
            <select
              name="currency"
              id="currency"
              required
              class="w-full bg-zinc-800 border border-zinc-700 rounded px-4 py-2 text-zinc-200 focus:border-orange-500 focus:outline-none transition-colors">
              <option value="USD" {% if currency == "USD" %}selected{% endif %}>USD</option>
              <option value="EUR" {% if currency == "EUR" %}selected{% endif %}>EUR</option>
              <option value="GBP" {% if currency == "GBP" %}selected{% endif %}>GBP</option>
              <option value="CHF" {% if currency == "CHF" %}selected{% endif %}>CHF</option>
              <option value="JPY" {% if currency == "JPY" %}selected{% endif %}>JPY</option>
            </select>
          </div>
        </div>

        <!-- Paid by and Date -->
        <div class="grid grid-cols-2 gap-4">
          <div class="form-group">
            <label class="block text-sm font-medium text-zinc-400 mb-2" for="paid_by">
              Paid By
            </label>
            <select
              name="paid_by"
              id="paid_by"
              required
              class="w-full bg-zinc-800 border border-zinc-700 rounded px-4 py-2 text-zinc-200 focus:border-orange-500 focus:outline-none transition-colors">
              {% for (id, name) in participants %}
              <option value="{{ id }}" {% if *id == *paid_by %}selected{% endif %}>
                {{ name }}
              </option>
              {% endfor %}
            </select>
          </div>

          <div class="form-group">
            <label class="block text-sm font-medium text-zinc-400 mb-2" for="date">
              Date
            </label>
            <input
              type="date"
              name="date"
              id="date"
              value="{% if date.contains('T') %}{{ date.split_once('T').unwrap().0 }}{% else %}{{ date }}{% endif %}"
              required
              class="w-full bg-zinc-800 border border-zinc-700 rounded px-4 py-2 text-zinc-200 focus:border-orange-500 focus:outline-none transition-colors">
          </div>
        </div>
      </div>
    </div>

    <!-- Split Card -->
    <details class="bg-zinc-900 rounded-lg border border-zinc-700">
      <summary class="p-4 cursor-pointer hover:bg-zinc-800/50 rounded-lg transition-colors list-none">
        <div class="flex items-center justify-between">
          <h3 class="text-lg font-semibold text-zinc-300">Split</h3>
          <svg class="w-5 h-5 text-zinc-400 transition-transform details-arrow" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
          </svg>
        </div>
      </summary>
      <div class="px-4 pb-4 space-y-3">
        {% for (id, name) in participants %}
        <div class="flex items-center justify-between bg-zinc-800 rounded px-4 py-3 border border-zinc-700">
          <div class="flex items-center gap-4">
            <input
              type="checkbox"
              name="split_include_{{ id }}"
              id="split_include_{{ id }}"
              {% for split in split_ratios %}{% if split.entity_id.to_string() == *id %}checked{% endif %}{% endfor %}
              onchange="adjustSplitRatios()"
              class="w-4 h-4 accent-orange-500">
            <label for="split_include_{{ id }}" class="text-zinc-200">
              {{ name }}
            </label>
          </div>
          <input
            type="text"
            name="split_ratio_{{ id }}"
            id="split_ratio_{{ id }}"
            placeholder="1/1"
            value="{% for split in split_ratios %}{% if split.entity_id.to_string() == *id %}{{ split.ratio.numerator() }}/{{ split.ratio.denominator() }}{% endif %}{% endfor %}"
            class="w-24 bg-zinc-900 border border-zinc-600 rounded px-3 py-1 text-zinc-200 text-sm focus:border-orange-500 focus:outline-none">
        </div>
        {% endfor %}
      </div>
    </details>
  </form>

  <script>
    // Track if this is initial load to avoid overwriting existing values
    let isInitialLoad = true;
    
    function adjustSplitRatios() {
      // Skip adjustment on initial load if we're editing an expense (form title indicates editing)
      const formTitle = document.querySelector('h2').textContent;
      const isEditing = formTitle.includes('Edit');
      
      if (isInitialLoad && isEditing) {
        isInitialLoad = false;
        return;
      }
      
      // Get all checkboxes and their corresponding ratio inputs
      const checkboxes = document.querySelectorAll('input[type="checkbox"][name^="split_include_"]');
      
      // Count checked participants
      let checkedCount = 0;
      checkboxes.forEach(checkbox => {
        if (checkbox.checked) {
          checkedCount++;
        }
      });
      
      // Update ratios for all participants
      checkboxes.forEach(checkbox => {
        const id = checkbox.id.replace('split_include_', '');
        const ratioInput = document.getElementById('split_ratio_' + id);
        
        if (checkbox.checked && checkedCount > 0) {
          // Set equal split for checked participants
          ratioInput.value = '1/' + checkedCount;
        } else if (!checkbox.checked) {
          // Clear ratio for unchecked participants
          ratioInput.value = '0/1';
        }
      });
      
      isInitialLoad = false;
    }
    
    // Initialize on load
    document.addEventListener('DOMContentLoaded', adjustSplitRatios);
  </script>

  <style>
    summary {
      list-style: none;
    }
    summary::-webkit-details-marker {
      display: none;
    }
    details[open] .details-arrow {
      transform: rotate(180deg);
    }
  </style>

  <!-- Action buttons -->
  <div class="flex gap-4">
    <button
      type="button"
      class="flex-1 bg-zinc-800 hover:bg-zinc-700 text-white font-semibold py-2.5 px-6 rounded transition-colors border border-zinc-700"
      hx-tauri-invoke="render_transactions"
      hx-target="#expense-list">
      Cancel
    </button>

    <button
      type="submit"
      class="flex-1 bg-orange-500 hover:bg-orange-600 text-white font-semibold py-2.5 px-6 rounded transition-colors"
      hx-tauri-invoke="{{ submit_invoke }}"
      hx-target="#main-content">
      {{ submit_label }}
    </button>
  </div>
</div>
