name: Rust

on:
  push:
    branches: [ "main", "gh_action" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Install Tauri
      run: cargo install tauri-cli --version "^2.0" --locked
    - name: Install Bun
      run: curl -fsSL https://bun.com/install | bash
    - name: Build
      run: cargo tauri build
    - name: Run tests
      run: cargo test
    - name: Init Android build
      run: cargo tauri android init --ci
    - name: Build Android
      run: cargo tauri android build --ci
